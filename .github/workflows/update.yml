name: HOME PRIME stock-only sync

on:
  push:
    paths:
      - 'build_feed.py'
      - '.github/workflows/update.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: home-prime-stock-feed
  cancel-in-progress: true

jobs:
  sync-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests lxml

      - name: Generate stock-only YML for currently existing approved products
        env:
          PROM_API_TOKEN: ${{ secrets.PROM_API_TOKEN }}
          PROM_ID_AUDIT: "false"
          PROM_API_READ_ONLY: "false"
          PROM_YML_EXPORT_ONLY: "true"
          PROM_CATALOG_MAX_PAGES: "200"
          PROM_MIN_CONFIRMED_PRODUCTS: "400"
        run: python build_feed.py

      - name: Publish generated feed to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prom-feed.xml
          if git diff --cached --quiet; then
            echo "Feed is unchanged; no commit needed."
          else
            git commit -m "Update HOME PRIME stock-only Prom feed"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Purge public CDN cache for the current feed
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            "https://purge.jsdelivr.net/gh/lgrom857-lang/Home-prime@main/prom-feed.xml"

      - name: Upload feed and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-prime-stock-feed-report
          path: |
            sync-report.csv
            prom-feed.xml
            prom-duplicate-resolution.csv
          if-no-files-found: warn
          retention-days: 7
