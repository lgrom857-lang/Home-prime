name: HOME PRIME stock-only sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

jobs:
  sync-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests lxml

      - name: Generate stock-only YML for approved existing products
        env:
          PROM_API_TOKEN: ${{ secrets.PROM_API_TOKEN }}
          PROM_ID_AUDIT: "true"
          PROM_API_READ_ONLY: "false"
          PROM_YML_EXPORT_ONLY: "true"
        run: python build_feed.py

      - name: Save availability feed and report
        if: always()
        run: |
          if [ -f sync-report.csv ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sync-report.csv prom-feed.xml prom-id-audit.csv
            git diff --cached --quiet || git commit -m "Update HOME PRIME stock-only feed"
            git push
          fi
