name: HOME PRIME stock-only sync

on:
  push:
    paths:
      - 'build_feed.py'
      - '.github/workflows/update.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: home-prime-stock-feed
  cancel-in-progress: true

jobs:
  sync-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests lxml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate stock-only YML for currently existing approved products
        env:
          PROM_API_TOKEN: ${{ secrets.PROM_API_TOKEN }}
          PROM_ID_AUDIT: "false"
          PROM_API_READ_ONLY: "false"
          PROM_YML_EXPORT_ONLY: "true"
          PROM_CATALOG_MAX_PAGES: "200"
          PROM_MIN_CONFIRMED_PRODUCTS: "400"
        run: python build_feed.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy stock feed to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload feed and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-prime-stock-feed-report
          path: |
            sync-report.csv
            prom-feed.xml
            prom-duplicate-resolution.csv
          if-no-files-found: warn
          retention-days: 7
