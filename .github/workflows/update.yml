name: HOME PRIME stock-only sync

on:
  push:
    paths:
      - 'build_feed.py'
      - '.github/workflows/update.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

jobs:
  sync-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests lxml

      - name: Generate stock-only YML for approved existing products
        env:
          PROM_API_TOKEN: ${{ secrets.PROM_API_TOKEN }}
          PROM_ID_AUDIT: "true"
          PROM_API_READ_ONLY: "false"
          PROM_YML_EXPORT_ONLY: "true"
        run: python build_feed.py

      - name: Upload read-only audit files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-prime-prom-id-audit
          path: |
            prom-id-audit.csv
            prom-id-audit-details.csv
            prom-id-audit-details.json
            sync-report.csv
            prom-feed.xml
            prom-duplicate-resolution.csv
          if-no-files-found: warn
          retention-days: 7
