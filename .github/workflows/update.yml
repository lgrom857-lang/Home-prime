name: HOME PRIME stock-only sync

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests lxml

      - name: Update availability only
        env:
          PROM_API_TOKEN: ${{ secrets.PROM_API_TOKEN }}
          PROM_SYNC_LIMIT: "1"
          PROM_API_READ_ONLY: "false"
          PROM_TEST_ONLY_ID: "3154820091"
        run: python build_feed.py

      - name: Save synchronization report
        if: always()
        run: |
          if [ -f sync-report.csv ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sync-report.csv
            git diff --cached --quiet || git commit -m "Save HOME PRIME stock sync report"
            git push
          fi
