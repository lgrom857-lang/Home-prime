name: HOME PRIME stock feed

on:
  workflow_dispatch:
  push:
    paths:
      - "whitelist_prom.csv"
      - "build_feed.py"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "23 */4 * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests lxml

      - name: Build feed
        run: python build_feed.py

      - name: Publish generated feed to repository
        run: |
          test -s public/prom-feed.xml
          cp public/prom-feed.xml prom-feed.xml
          if [ -f public/sync-report.csv ]; then cp public/sync-report.csv sync-report.csv; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prom-feed.xml sync-report.csv
          git diff --cached --quiet || git commit -m "Update Prom availability feed"
          git push
